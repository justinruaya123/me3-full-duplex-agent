[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "me3-full-duplex-agent"
version = "0.1.0"
description = "Harness-neutral duplex conversation and durable local Pi jobs"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
speech = ["httpx>=0.28,<1", "sounddevice>=0.5,<0.6", "mcp>=1.28,<2"]
mcp = ["mcp>=1.28,<2", "httpx>=0.28,<1"]
test = ["httpx>=0.28,<1", "aiohttp>=3.14.4,<4"]
speech-server = [
    "aiohttp>=3.14.4,<4",
    "numpy>=1.26,<3; sys_platform == 'darwin'",
    "scipy>=1.10,<2; sys_platform == 'darwin'",
    "mlx-whisper>=0.4,<1; sys_platform == 'darwin'",
    "mlx-audio>=0.3,<1; sys_platform == 'darwin'",
    "misaki[en]>=0.9,<1; sys_platform == 'darwin'",
]

[project.scripts]
me3 = "me3.cli:main"

[tool.setuptools.packages.find]
include = ["me3*"]
