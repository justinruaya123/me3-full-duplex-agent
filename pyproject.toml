[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "me3-full-duplex-agent"
version = "0.1.0"
description = "Harness-neutral duplex conversation and durable local Pi jobs"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
web = ["aiohttp>=3.14.4,<4", "httpx>=0.28,<1"]
local-tts = ["sherpa-onnx==1.13.8", "numpy>=1.26,<3"]
website = ["playwright==1.58.0"]
speech = ["httpx>=0.28,<1", "sounddevice>=0.5,<0.6", "mcp>=1.28,<2"]
mcp = ["mcp>=1.28,<2", "httpx>=0.28,<1"]
test = ["playwright==1.58.0", "httpx>=0.28,<1", "aiohttp>=3.14.4,<4"]
speech-server = [
    "aiohttp>=3.14.4,<4",
    "numpy>=1.26,<3; sys_platform == 'darwin'",
    "scipy>=1.10,<2; sys_platform == 'darwin'",
    "mlx-whisper>=0.4,<1; sys_platform == 'darwin'",
    "mlx-audio>=0.3,<1; sys_platform == 'darwin'",
    "misaki[en]>=0.9,<1; sys_platform == 'darwin'",
]

[project.scripts]
me3 = "me3.cli:main"

[tool.setuptools.packages.find]
include = ["me3*", "integrations"]

[tool.setuptools.package-data]
me3 = ["pi_luna_voice.mjs", "pi_extension.mjs", "pi_voice_view.mjs", "pi_voice_mode.mjs",
       "pi_github.mjs", "pi_prototype.mjs", "skills/github/SKILL.md"]
integrations = ["openintelligentui/*"]
