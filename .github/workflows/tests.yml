name: preliminary-tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: ./scripts/setup-openintelligentui.sh
      - run: npm ci --prefix integrations/voicechat --no-audit --no-fund
      - run: sudo apt-get update && sudo apt-get install -y portaudio19-dev libasound2-dev
      - run: python -m pip install -e '.[test,mcp]' -r requirements-duplex.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/*.test.mjs
      - run: python -m me3 demo
      - run: python -m me3 benchmark --trials 3 --output /tmp/me3-ci-benchmark
      - run: python -m compileall -q me3 tests
