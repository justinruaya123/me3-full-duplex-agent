name: preliminary-tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test,mcp]'
      - run: python -m unittest discover -s tests -v
      - run: python -m me3 demo
      - run: python -m me3 benchmark --trials 3 --output /tmp/me3-ci-benchmark
      - run: python -m compileall -q me3 tests
